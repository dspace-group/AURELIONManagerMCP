name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: 
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --python 3.12 --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
